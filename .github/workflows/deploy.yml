# 每次推到 main：生成静态网站（nuxt generate），放到 GitHub Pages（yiyun.me）
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nuxt generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
      - id: deployment
        uses: actions/deploy-pages@v4
